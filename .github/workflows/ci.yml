name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make workflows

  lint:
    runs-on: ubuntu-latest
    # The release is built with cgo off; scripts/lint.sh sets CGO_ENABLED per pass (0, then 1
    # for the test build) and GOOS/GOARCH from RELEASE_TARGETS, and release_net_check uses 0.
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: make lint
      - run: make lint-rules-test
      - run: make release-net-check

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - run: make build test
      - run: ./dist/yo-human version

  perf:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - name: p95 within budget
        if: matrix.os != 'ubuntu-latest'
        run: make perf
      - name: p95 within budget, and budgets only tighten
        if: matrix.os == 'ubuntu-latest'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base HEAD "origin/$PR_BASE")"
          elif [ -n "$PUSH_BEFORE" ] && [ -n "$(printf %s "$PUSH_BEFORE" | tr -d 0)" ]; then
            base="$PUSH_BEFORE"
            git cat-file -e "$base^{commit}"
          fi
          args=""
          if [ -n "$base" ] && git cat-file -e "$base:perf-budgets.json" 2>/dev/null; then
            git show "$base:perf-budgets.json" > "$RUNNER_TEMP/base-budgets.json"
            args="PERF_ARGS=--base-budgets=$RUNNER_TEMP/base-budgets.json"
          fi
          echo "base=${base:-none} args=${args:-none}"
          make perf $args

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - name: Per-package coverage floors that only rise
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base HEAD "origin/$PR_BASE")"
          elif [ -n "$PUSH_BEFORE" ] && [ -n "$(printf %s "$PUSH_BEFORE" | tr -d 0)" ]; then
            base="$PUSH_BEFORE"
            git cat-file -e "$base^{commit}"
          fi
          args=""
          if [ -n "$base" ] && git cat-file -e "$base:coverage-floors.json" 2>/dev/null; then
            git show "$base:coverage-floors.json" > "$RUNNER_TEMP/base-floors.json"
            args="FLOORS_ARGS=--base-floors=$RUNNER_TEMP/base-floors.json"
          fi
          echo "base=${base:-none} args=${args:-none}"
          make floors $args

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: History scan (scripts/secrets.sh holds the 0/1/2 contract)
        run: scripts/secrets.sh
      - run: make secrets-test

  vuln:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: make vuln
