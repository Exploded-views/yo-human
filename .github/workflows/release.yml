name: release

on:
  push:
    tags: ['v*']

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    # The only write scope: goreleaser creates the release and uploads the archives.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          # No cache on a tag-triggered job that holds a write token: a poisoned cache entry
          # from an earlier run could otherwise end up inside the released binaries.
          cache: false
      # Blocking: a finding fails the job, and nothing is released.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
      # The checks a release must pass before goreleaser publishes it: a plain build holds no e2e
      # test hook, and a snapshot's every archive matches checksums.txt and holds no hook either.
      - run: make nohooks
      - run: make release-check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
